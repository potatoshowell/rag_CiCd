apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app-deployment
  labels:
    app: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      labels:
        app: rag-app
    spec:
      containers:
      - name: rag-app
        image: localhost/rag-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: QDRANT_HOST
          value: "qdrant"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          limits:
            memory: "4Gi"
            cpu: "1000m"
          requests:
            memory: "512Mi"
            cpu: "500m"